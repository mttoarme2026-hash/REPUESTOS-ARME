<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#1a3a5c;--azul2:#2563a8;--verde:#15803d;--naranja:#b45309;--rojo:#991b1b;--bg:#f1f5f9;--card:#fff;--borde:#e2e8f0;--texto:#1e293b;--muted:#64748b}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--texto);min-height:100vh}
.header{background:var(--azul);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.h-left{display:flex;align-items:center;gap:10px}
.h-title{font-size:16px;font-weight:600}
.h-sub{font-size:11px;opacity:.7;margin-top:1px}
.h-date{font-size:10px;background:rgba(255,255,255,.15);padding:4px 9px;border-radius:20px;white-space:nowrap}
.sbar{background:#fff;border-bottom:1px solid var(--borde);padding:6px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px;vertical-align:middle}
.sbody{padding:12px 12px 10px;background:#fff;border-bottom:1px solid var(--borde);position:sticky;top:57px;z-index:90}
.sinput{position:relative}
.sinput svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sinput input{width:100%;padding:10px 10px 10px 38px;font-size:15px;border:1.5px solid var(--borde);border-radius:10px;background:#fff;color:var(--texto);outline:none}
.sinput input:focus{border-color:var(--azul2)}
.sinput input::placeholder{color:#94a3b8}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.filters select{font-size:13px;padding:7px 10px;border:1.5px solid var(--borde);border-radius:8px;background:#fff;color:var(--texto);outline:none}
.rcount{font-size:12px;color:var(--muted);margin-top:7px}
.lista{padding:10px 12px 80px}
.card{background:#fff;border:1px solid var(--borde);border-radius:13px;padding:13px 14px;margin-bottom:9px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card.open{border:1.5px solid var(--azul2)}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ccode{font-family:monospace;font-size:11px;color:var(--muted);margin-bottom:3px}
.cname{font-size:14px;font-weight:600;color:var(--texto);line-height:1.3}
.cgroup{font-size:11px;color:var(--muted);margin-top:3px}
.badge{flex-shrink:0;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;text-align:center;min-width:54px}
.bok{background:#dcfce7;color:#15803d}
.blow{background:#fef3c7;color:#b45309}
.bzero{background:#fee2e2;color:#991b1b}
.blabel{font-size:9px;font-weight:500;display:block;opacity:.8;margin-top:1px}
.cdetail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--borde)}
.card.open .cdetail{display:block}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.dval{font-size:13px;font-weight:600;color:var(--texto);line-height:1.3}
.dval.ubicacion{font-size:15px;color:var(--azul2);font-family:monospace;letter-spacing:.5px}
.dval.ok{color:var(--verde)}.dval.low{color:var(--naranja)}.dval.zero{color:var(--rojo)}
.dfull{grid-column:1/-1}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty span{font-size:40px;display:block;margin-bottom:10px;opacity:.4}
</style>
</head>

var EX=-1;
function ss(d){if(d.stock<=0)return'zero';if(d.minimo>0&&d.stock<=d.minimo)return'low';return'ok';}
function sl(d){var n=d.stock%1===0?d.stock:d.stock.toFixed(2);return{v:String(n),u:d.unidad||'UND',s:ss(d)};}
function eh(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function poblar(){
  var gs=[...new Set(D.map(d=>d.grupo).filter(Boolean))].sort();
  var sel=document.getElementById('fg');
  sel.innerHTML='<option value="">Todos los grupos</option>'+gs.map(g=>'<option value="'+eh(g)+'">'+eh(g)+'</option>').join('');
}
function filtrar(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var grp=document.getElementById('fg').value;
  var st=document.getElementById('fs').value;
  var res=D.filter(function(d,i){
    var txt=(d.codigo+' '+d.nombre+' '+d.ubicacion).toLowerCase();
    if(q){var ws=q.split(' ');if(!ws.every(function(w){return txt.includes(w);}))return false;}
    if(grp&&d.grupo!==grp)return false;
    if(st&&ss(d)!==st)return false;
    return true;
  });
  document.getElementById('rc').textContent=q||grp||st?res.length.toLocaleString()+' de '+D.length.toLocaleString()+' artículos':D.length.toLocaleString()+' artículos';
  if(!res.length){document.getElementById('lista').innerHTML='<div class="empty"><span>🔍</span><p>No se encontraron repuestos</p></div>';return;}
  var html=res.map(function(d,i){
    var s=sl(d);var op=EX===i;
    return '<div class="card'+(op?' open':'')+'" onclick="tc('+i+')">'
      +'<div class="ctop"><div style="min-width:0"><div class="ccode">'+eh(d.codigo)+'</div>'
      +'<div class="cname">'+eh(d.nombre)+'</div>'
      +'<div class="cgroup">'+eh(d.grupo)+'</div></div>'
      +'<div class="badge b'+s.s+'">'+s.v+'<span class="blabel">'+eh(s.u)+'</span></div></div>'
      +'<div class="cdetail"><div class="dgrid">'
      +'<div class="dfull"><div class="dlabel">📍 Ubicación en bodega</div><div class="dval ubicacion">'+eh(d.ubicacion||'— Sin ubicar')+'</div></div>'
      +'<div><div class="dlabel">📦 Stock actual</div><div class="dval '+s.s+'">'+s.v+' '+eh(s.u)+'</div></div>'
      +'<div><div class="dlabel">⚠️ Mínimo / Máx</div><div class="dval">'+(d.minimo||'—')+' / '+(d.maximo||'—')+'</div></div>'
      +(d.costo>0?'<div><div class="dlabel">💰 Costo unitario</div><div class="dval">$'+Math.round(d.costo).toLocaleString('es-CO')+'</div></div>':'')
      +'<div><div class="dlabel">🏷️ Grupo</div><div class="dval">'+eh(d.grupo||'—')+'</div></div>'
      +'</div></div></div>';
  }).join('');
  document.getElementById('lista').innerHTML=html;
}
function tc(i){EX=EX===i?-1:i;filtrar();if(EX>=0){setTimeout(function(){var cs=document.querySelectorAll('.card');if(cs[i])cs[i].scrollIntoView({behavior:'smooth',block:'nearest'});},50);}}
document.getElementById('q').addEventListener('input',function(){EX=-1;filtrar();});
document.getElementById('fg').addEventListener('change',function(){EX=-1;filtrar();});
document.getElementById('fs').addEventListener('change',function(){EX=-1;filtrar();});
poblar();filtrar();
</script>
