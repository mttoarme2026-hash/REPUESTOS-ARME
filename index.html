<style>
:root{--az:#1a3a5c;--az2:#2563a8;--bg:#eef2f7;--bd:#dde4ee;--tx:#1e293b;--mu:#64748b;--ok:#15803d;--okb:#dcfce7;--wa:#b45309;--wab:#fef3c7;--ag:#b91c1c;--agb:#fee2e2}
*{box-sizing:border-box;margin:0;padding:0}

body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.35}
.hdr{background:var(--az);color:#fff;padding:14px 16px 12px}
.hdr h1{font-size:18px;font-weight:700;letter-spacing:.2px}
.hdr p{font-size:12px;opacity:.78;margin-top:2px}
.stale{background:#fff7e6;border-bottom:1px solid #f5d38a;color:#7a4b00;font-size:12.5px;padding:8px 16px}

.sw{position:relative}
.sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mu)}
#q{width:100%;height:46px;padding:0 42px 0 40px;font-size:16px;border:1.5px solid var(--bd);border-radius:12px;background:#f8fafc;color:var(--tx);outline:none;-webkit-appearance:none;appearance:none}

#clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;font-size:24px;line-height:1;color:var(--mu);cursor:pointer;display:none}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--bd);background:#fff;color:var(--tx);font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip small{font-weight:500;color:var(--mu);margin-left:4px}
.chip.on{background:var(--az);border-color:var(--az);color:#fff}
.chip.on small{color:#cbd5e1}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px}
#g{flex:1;min-width:0;height:38px;font-size:14px;padding:0 10px;border:1.5px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx)}
#rc{font-size:12px;color:var(--mu);white-space:nowrap}
main{padding:10px 12px 90px;max-width:760px;margin:0 auto}
.cd{background:#fff;border:1px solid var(--bd);border-left:5px solid var(--ok);border-radius:14px;padding:12px 12px 11px;margin-bottom:9px;cursor:pointer}
.cd.bj{border-left-color:#d97706}
.cd.ag{border-left-color:var(--ag);background:#fffafa}
.cd:focus-visible{outline:2px solid var(--az2)}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.inf{min-width:0;flex:1}
.cc{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mu);letter-spacing:.3px}
.cn{font-size:15px;font-weight:650;margin-top:2px;overflow-wrap:anywhere}
.cl{display:flex;align-items:center;gap:5px;margin-top:6px;font:700 13.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--az2)}
.cl.x{font:600 12.5px system-ui,sans-serif;color:var(--mu)}
.cl svg{flex:0 0 auto}
.bd{flex:0 0 auto;min-width:62px;text-align:center;border-radius:12px;padding:6px 8px}
.bd b{display:block;font-size:19px;line-height:1.1}
.bd small{display:block;font-size:10px;font-weight:600;opacity:.8;margin-top:1px}
.bd.ok{background:var(--okb);color:var(--ok)}
.bd.bj{background:var(--wab);color:var(--wa)}
.bd.ag{background:var(--agb);color:var(--ag);font-size:11px;font-weight:800;padding:9px 8px;letter-spacing:.4px}
.dt{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--bd)}
.cd.open .dt{display:block}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px}
.it.f{grid-column:1/-1}
.lb{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mu)}
.vl{font-size:14px;font-weight:650;margin-top:1px}
.vl.big{font:800 17px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--az2)}
.vl.bigx{font-size:15px;color:var(--mu)}
.sub{font-size:12px;font-weight:500;color:var(--mu)}
.nt{grid-column:1/-1;font-size:12px;color:var(--mu);background:#f1f5f9;border-radius:8px;padding:7px 9px}
.nt2{background:#fff7e6;border:1px solid #f5d38a;color:#7a4b00;font-size:12.5px;border-radius:10px;padding:8px 11px;margin-bottom:9px}
.more{display:block;width:100%;margin:6px 0 0;padding:13px;border:1.5px solid var(--az);background:#fff;color:var(--az);font-size:14px;font-weight:700;border-radius:12px;cursor:pointer}
.empty{text-align:center;padding:44px 18px;color:var(--mu)}
.empty b{display:block;font-size:16px;color:var(--tx);margin-bottom:4px}
</style>
</head>

  return {t:s};
}
var PIN='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

var R=DB.r.map(function(a){
  var r={c:String(a[0]),n:a[1],g:a[2],u:a[3],s:a[4],l:a[5],mi:a[6],ma:a[7],co:a[8],fs:a[9],fe:a[10],fp:a[11],ft:a[12],sf:a[13]};
  r.st=r.s<=0?'ag':(r.mi>0&&r.s<=r.mi?'bj':'ok');
  r.o=r.st==='ag'?1:0;
  r.k=norm(r.c+' '+r.n+' '+r.l+' '+r.g);
  r.cn=norm(r.c);
  r.nn=norm(r.n);
  return r;
});
R.sort(function(a,b){return a.o-b.o||a.n.localeCompare(b.n,'es');});
R.forEach(function(r,i){r.i=i;});

var cnt={all:R.length,disp:0,bj:0,ag:0};
R.forEach(function(r){if(r.st==='ag')cnt.ag++;else{cnt.disp++;if(r.st==='bj')cnt.bj++;}});

var f={q:'',st:'all',g:''},cur=[],shown=PAGE;
var $q=document.getElementById('q'),$ls=document.getElementById('ls'),$rc=document.getElementById('rc'),$g=document.getElementById('g'),$clr=document.getElementById('clr'),$chips=document.getElementById('chips');

// Encabezado
document.getElementById('sub').textContent='Almacén ALMDEL · datos del '+fd(DB.gen);
var age=TODAY-DB.gen;
if(age>10){var $s=document.getElementById('stale');$s.hidden=false;$s.textContent='Esta información se generó hace '+age+' días. Si es un repuesto crítico, confirma la existencia con almacén.';}

// Chips
var CH=[['all','Todos'],['disp','Disponibles'],['bj','En/bajo mínimo'],['ag','Agotados']];
function drawChips(){
  $chips.innerHTML=CH.map(function(c){return '<button type="button" class="chip'+(f.st===c[0]?' on':'')+'" data-st="'+c[0]+'">'+c[1]+'<small>'+cnt[c[0]].toLocaleString('es-CO')+'</small></button>';}).join('');
}
$chips.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;f.st=b.getAttribute('data-st');drawChips();run();});

// Grupos
(function(){
  var m={};R.forEach(function(r){var g=r.g||'Sin grupo';m[g]=(m[g]||0)+1;});
  var gs=Object.keys(m).sort(function(a,b){return a.localeCompare(b,'es');});
  $g.innerHTML='<option value="">Todos los grupos</option>'+gs.map(function(g){return '<option value="'+esc(g)+'">'+esc(g)+' ('+m[g].toLocaleString('es-CO')+')</option>';}).join('');
})();
$g.addEventListener('change',function(){f.g=$g.value;run();});

var tmr=null;
$q.addEventListener('input',function(){
  $clr.style.display=$q.value?'block':'none';
  clearTimeout(tmr);tmr=setTimeout(function(){f.q=$q.value;run();},120);
});
$clr.addEventListener('click',function(){$q.value='';$clr.style.display='none';f.q='';run();$q.focus();});

var partial=false;
function pass(r){
  if(f.st==='disp'&&r.st==='ag')return false;
  if(f.st==='bj'&&r.st!=='bj')return false;
  if(f.st==='ag'&&r.st!=='ag')return false;
  if(f.g&&(r.g||'Sin grupo')!==f.g)return false;
  return true;
}
function run(){
  var qn=norm(f.q),terms=qn?qn.split(' '):[];
  partial=false;
  cur=R.filter(function(r){
    if(!pass(r))return false;
    for(var i=0;i<terms.length;i++){if(r.k.indexOf(terms[i])<0)return false;}
    return true;
  });
  // Sin coincidencia exacta: mostrar los que coinciden con la mayor cantidad de palabras
  if(!cur.length&&terms.length>1){
    var best=0,sc=[],df=terms.map(function(t){var c=0;for(var j=0;j<R.length;j++){if(R[j].k.indexOf(t)>=0)c++;}return c;});
    R.forEach(function(r){
      if(!pass(r))return;
      var n=0,w=0;for(var i=0;i<terms.length;i++){if(r.k.indexOf(terms[i])>=0){n++;w+=1/df[i];}}
      if(n>0){r.pw=w;sc.push([r,n]);if(n>best)best=n;}
    });
    cur=sc.filter(function(x){return x[1]===best;}).map(function(x){return x[0];});
    partial=cur.length>0;
  }
  if(terms.length){
    cur.forEach(function(r){r.sc=(r.cn===qn)?0:(r.nn.indexOf(terms[0])===0?1:2);});
    cur.sort(function(a,b){return (partial?(b.pw-a.pw):0)||a.sc-b.sc||a.o-b.o||a.i-b.i;});
  }
  shown=PAGE;draw();
}

function cardHTML(r){
  var u=ubi(r.l);
  var bd=r.st==='ag'?'<div class="bd ag">AGOTADO</div>':'<div class="bd '+r.st+'"><b>'+num(r.s)+'</b><small>'+esc(r.u||'UND')+'</small></div>';
  var loc=(r.st==='ag'&&!u.x?'Última ubicación: ':'')+esc(u.t);
  return '<article class="cd '+r.st+'" data-i="'+r.i+'" tabindex="0" role="button" aria-expanded="false">'
    +'<div class="top"><div class="inf"><div class="cc">'+esc(r.c)+(r.g?' · '+esc(r.g):'')+'</div>'
    +'<div class="cn">'+esc(r.n)+'</div>'
    +'<div class="cl'+(u.x?' x':'')+'">'+(u.x?'':PIN)+'<span>'+loc+'</span></div></div>'+bd+'</div></article>';
}
function dateItem(label,day){
  return '<div class="it"><div class="lb">'+label+'</div><div class="vl">'+(day?fd(day):'Sin registro')+'</div>'+(day?'<div class="sub">'+ago(day)+'</div>':'')+'</div>';
}
function detHTML(r){
  var u=ubi(r.l);
  var h='<div class="dt"><div class="gr">';
  h+='<div class="it f"><div class="lb">'+(r.st==='ag'?'Última ubicación conocida':'Ubicación en bodega')+'</div><div class="vl '+(u.x?'bigx':'big')+'">'+esc(u.t)+'</div>'+(r.l&&!u.x?'<div class="sub">'+esc(r.l)+'</div>':'')+'</div>';
  h+='<div class="it"><div class="lb">Stock actual</div><div class="vl">'+(r.s>0?num(r.s)+' '+esc(r.u||'UND'):'Agotado')+'</div></div>';
  var mm=(r.mi>0||r.ma>0)?(r.mi>0?num(r.mi):'—')+' / '+(r.ma>0?num(r.ma):'—'):'Sin definir';
  h+='<div class="it"><div class="lb">Mínimo / Máximo</div><div class="vl">'+mm+'</div>'+(r.st==='bj'?'<div class="sub">En o bajo el mínimo</div>':'')+'</div>';
  h+=dateItem('Última salida',r.fs)+dateItem('Último pedido',r.fp)+dateItem('Última entrada',r.fe)+dateItem('Último traslado',r.ft);
  h+='<div class="it"><div class="lb">Código SAP</div><div class="vl">'+esc(r.c)+'</div></div>';
  if(r.co>0)h+='<div class="it"><div class="lb">Costo unitario</div><div class="vl">$'+Math.round(r.co).toLocaleString('es-CO')+'</div></div>';
  if(r.sf)h+='<div class="nt">Este artículo aparece en el inventario de SAP pero no tiene ficha de ubicación ni fechas registradas.</div>';
  return h+'</div></div>';
}

function draw(){
  var n=cur.length;
  $rc.textContent=n.toLocaleString('es-CO')+(n===1?' resultado':' resultados');
  if(!n){$ls.innerHTML='<div class="empty"><b>No hay repuestos que coincidan</b>Prueba con menos palabras, con el código SAP o quita los filtros.</div>';return;}
  var show=cur.slice(0,shown),h=(partial?'<div class="nt2">No hay nada que coincida con todo lo que escribiste. Estos coinciden con parte de la búsqueda.</div>':'')+show.map(cardHTML).join('');
  if(n>shown)h+='<button type="button" class="more" id="more">Mostrar más ('+(n-shown).toLocaleString('es-CO')+' restantes)</button>';
  $ls.innerHTML=h;
}
$ls.addEventListener('click',function(e){
  if(e.target.id==='more'){shown+=PAGE*2;draw();return;}
  var c=e.target.closest('.cd');if(!c)return;toggle(c);
});
$ls.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var c=e.target.closest&&e.target.closest('.cd');if(!c||e.target!==c)return;
  e.preventDefault();toggle(c);
});
function toggle(c){
  var open=c.classList.toggle('open');
  c.setAttribute('aria-expanded',open?'true':'false');
  if(open&&!c.querySelector('.dt')){c.insertAdjacentHTML('beforeend',detHTML(R[+c.getAttribute('data-i')]));}
}

drawChips();run();
})();
</script>
</body>
</html>
